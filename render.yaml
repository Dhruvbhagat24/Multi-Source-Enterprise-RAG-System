services:
  - type: web
    name: documind-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:
      name: chroma-data
      mountPath: /opt/render/project/src/dbv2
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        sync: false
      - key: INTERNAL_AUTH_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PRIMARY_PROVIDER
        sync: false
      - key: LLM_PRIMARY_MODEL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: EMBEDDINGS_DEFAULT_PROVIDER
        value: hf
      - key: EMBEDDINGS_DEFAULT_MODEL
        value: all-MiniLM-L6-v2
